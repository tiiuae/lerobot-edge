# Dataset Wizard Configuration
# WARNING: This file may contain credentials. Do NOT commit it to version control.
# Add 'config.yaml' to your .gitignore.
# See config.example.yaml for a template with placeholder values.

# ── Pipeline control ──────────────────────────────────────────────────────────
# These can be overridden at runtime with --start-from / --stop-at CLI flags.
start_from: conversion  # Options: conversion | merge | joint_to_ee | upload
stop_at: joint_to_ee         # Options: conversion | merge | joint_to_ee | upload

# ── Dataset location ──────────────────────────────────────────────────────────
base_path: .

# ── Output dataset name ───────────────────────────────────────────────────────
merged_name: paper-cup-box-22-Jan-merged

# ── Joint-space to end-effector conversion ───────────────────────────────────
# Runs after merge when the pipeline range includes joint_to_ee.
joint_to_ee:
  output_repo_id: paper-cup-box-22-Jan-merged_ee
  feature_keys:
    - observation.state
    - action

# ── Datasets to merge ─────────────────────────────────────────────────────────
# List the folder names (relative to base_path) that you want to merge.
# Comment out entries you want to skip.
datasets:
- paper-cup-box-22-Jan
- paper-cup-box-22-Jan-copy

