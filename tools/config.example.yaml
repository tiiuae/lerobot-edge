# Dataset Wizard Configuration — Example
# Copy this file to config.yaml and fill in your values.
# WARNING: config.yaml may contain SFTP credentials. Do NOT commit it.

# ── Pipeline control ──────────────────────────────────────────────────────────
# Options: conversion | merge | ee_conversion | compress | upload
start_from: conversion
stop_at: upload

# ── Dataset location ──────────────────────────────────────────────────────────
base_path: ~/.cache/huggingface/lerobot/your-username

# ── Output dataset name ───────────────────────────────────────────────────────
merged_name: my-merged-dataset

# ── Datasets to merge ─────────────────────────────────────────────────────────
datasets:
  - my-dataset-1
  - my-dataset-2
  - my-dataset-3

# ── EE conversion + action representations (Stage 3) ─────────────────────────
# Set enabled: false to skip this stage. ee_frame is required when enabled.
#
# ee_frame:   robot_base — EE in robot base_link frame (both arms share one frame)
#             arm        — EE in each arm's own base_link frame
# rot_repr:   orientation representation for EE delta/relative:
#             quat   — relative unit quaternion        (delta/relative are [8])
#             rotvec — rotation vector (axis*angle rad) (delta/relative are [7])
#             both   — emit both (quat under base name, rotvec under .rotvec)  [default]
# include_joint_repr: also compute joint-space action.delta / action.relative.
#
# Columns added to every parquet file (rot_repr: both):
#   observation.ee_left/right        [8]  x,y,z,qw,qx,qy,qz,gripper  (from state)
#   action.ee_left/right             [8]  same (from action — always computed)
#   action.ee_*.delta                [8]  pos + relative quaternion + gripper
#   action.ee_*.delta.rotvec         [7]  pos + rotation vector + gripper
#   action.ee_*.relative             [8]  action EE vs obs EE (quaternion)
#   action.ee_*.relative.rotvec      [7]  action EE vs obs EE (rotation vector)
#   action.delta                     [16] sequential joint delta (include_joint_repr)
#   action.relative                  [16] joint action vs state  (include_joint_repr)
joint_to_ee:
  enabled: true
  ee_frame: robot_base       # or: arm
  rot_repr: both             # quat | rotvec | both
  include_joint_repr: true

# ── SFTP upload configuration ─────────────────────────────────────────────────
sftp:
  hostname: xxx.xxx.xxx.xxx
  port: 22
  username: your_username
  password: your_password
  remote_path: /path/to/remote/directory
