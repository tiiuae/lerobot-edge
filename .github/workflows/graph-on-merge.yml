name: graph-on-merge
on:
  push:
    branches: [main]
    paths-ignore: ['graphify-out/**', 'docs/diagrams/**']

permissions:
  contents: write
  id-token: write
  pages: write # docs site (docs: true with docs_cmd)

jobs:
  graph:
    uses: tiiuae/dev-standard/.github/workflows/graph-on-merge.yml@v1
    with:
      docs: false # true once the repo has a docs site (skill docs-site), with:
      # docs_cmd: make docs # builds docs/_build/html, published to GitHub Pages (source: GitHub Actions)
      archify: true
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
