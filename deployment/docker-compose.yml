# The pi0.5 model server in Docker. Run from this directory:
#   docker compose up -d --build
# or through the Makefile: `make docker-up-d CKPT=/models/<dir>/pretrained_model GPU=0`.
# CKPT is a path inside the container: MODELS_DIR on the host is mounted at /models.
services:
  lerobot_server:
    image: ${DOCKER_IMAGE:-lerobot-pi05-server}:${DOCKER_TAG:-latest}
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    init: true
    network_mode: host # the robot client connects to PORT on this machine
    volumes:
      - ${MODELS_DIR:-/home/ibrahim/storage}:/models:ro
      # Holds the PaliGemma tokenizer the pre-processor loads by name.
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
      - ${DEBUG_HOST_DIR:-/tmp/lerobot_debug}:/debug
    environment:
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
    command: >-
      --ckpt_path ${CKPT:-/models/checkpoint}
      --device cuda
      --port ${PORT:-8800}
      --idle_timeout ${IDLE_TIMEOUT:--1}
      ${EXTRA:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU:-0}"]
              capabilities: [gpu]
